# Render Blueprint — the EMS and its database, for a demonstration install.
#
# Render → Blueprints → New Blueprint Instance → pick this repository. It
# creates both services and wires DATABASE_URL between them, which is the step
# that is easy to get wrong by hand.
#
# BUILT FROM apps/ems/Dockerfile — the same image the school's own server runs,
# rather than a second recipe that can drift from it. That image already knows
# the two things this app needs and a generic Node build does not: Prisma's
# query engine wants OpenSSL on alpine, and its entrypoint applies pending
# migrations before serving, exiting rather than serving against a schema the
# code does not expect. The app seeds itself on first boot when the database is
# empty.
#
# THIS IS A DEMONSTRATION INSTALL, NOT THE SCHOOL'S. Two things below say so
# and both matter:
#
#   SEED_DEMO=true fills the database with invented pupils, staff and payments
#   and creates the eight accounts listed in the README, all sharing a password
#   published in a public file. That is right for showing the system and wrong
#   for a school's real records. The school's own server (deploy/contabo) sets
#   neither of these and gets a single administrator instead.
#
#   plan: free on the database means Render deletes it after 30 days. Fine for
#   a demonstration. Anything entered during one is not somewhere to keep it.
#
# The free web service also sleeps after about 15 minutes idle and takes the
# better part of a minute to wake. Open the URL a few minutes before showing
# it to anybody.

databases:
  - name: ststephen-ems-db
    plan: free
    databaseName: ststephen_ems
    user: ststephen

services:
  - type: web
    name: ststephen-ems
    runtime: docker
    plan: free
    # Both are relative to the repository root. The Dockerfile copies from its
    # own directory, so the build context must be apps/ems and not the root.
    rootDir: apps/ems
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ststephen-ems-db
          property: connectionString
      # Sessions are signed with this, and the app throws on boot without it.
      # Generated by Render and never seen by anybody, which is the point — a
      # secret in a repository is not one.
      - key: AUTH_SECRET
        generateValue: true
      # Demonstration data and the README's eight accounts. Remove this key for
      # any install holding real pupils.
      - key: SEED_DEMO
        value: "true"
      # Prompted for at creation rather than stored here. With SEED_DEMO on the
      # seeded accounts work regardless; set it anyway so the administrator is
      # not on a published password.
      - key: ADMIN_PASSWORD
        sync: false
