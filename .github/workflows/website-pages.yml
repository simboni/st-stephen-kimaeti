# PREVIEW COPY of the public website, published free from this repository.
#
# The school's real home is its own server (deploy/contabo/, runbook in
# docs/DEPLOY-CONTABO.md). This is a link to share while that server is being
# set up, and afterwards a way to view a branch before it goes live.
#
# WEBSITE ONLY. The EMS needs Node and PostgreSQL, which GitHub Pages cannot
# run, so there is no management system at this address. Contact and complaint
# forms here reach the school through the FormSubmit fallback; the EMS
# front-office queue only starts filling once the real server is up.
#
# Every run before this one failed at the deploy step with "Ensure GitHub Pages
# has been enabled", because Pages had never been switched on for the
# repository and this workflow assumed somebody would do it by hand. It now
# turns Pages on itself through actions/configure-pages, so there is no manual
# step to forget. If that ever fails, the fallback is still Settings → Pages →
# Build and deployment → Source: "GitHub Actions".
#
# The preview rebuilds on every push to main at
# https://simboni.github.io/st-stephen-kimaeti/
name: Publish website preview (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - ".github/workflows/website-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on the first time this runs, rather than leaving a
          # manual setting for somebody to forget.
          enablement: true

      - run: npm run build
        env:
          # Pages serves a project repository under /<repo>/; the action reports
          # that prefix, so it stays right if the repository is ever renamed.
          # Empty it when the site moves to a root custom domain.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Marks the build as a preview: a strip across the top of every page,
          # and robots.txt disallowing everything. The pages carry photographs
          # of identifiable children, fee figures, and news and term dates that
          # are still placeholders — none of which should turn up in a search
          # for the school before the school has published them itself.
          NEXT_PUBLIC_SITE_PREVIEW: "1"

      # Next.js emits _next/; without this, Pages' legacy Jekyll step would
      # strip every underscore-prefixed directory and the CSS/JS would 404.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
